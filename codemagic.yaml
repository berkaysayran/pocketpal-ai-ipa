workflows:
  pocketpal-ios:
    name: PocketPal iOS (development IPA)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: pocketpalai                   # name of the key in Codemagic Team integrations
    environment:
      groups:
        - certificate_credentials               # contains CERTIFICATE_PRIVATE_KEY (secure variable)
      node: 22.21.0                             # pinned in the repo's .nvmrc
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.berkaysayran.pocketpalai
        XCODE_WORKSPACE: PocketPal.xcworkspace
        XCODE_SCHEME: PocketPal
        NODE_OPTIONS: "--max-old-space-size=4096"      # fixes "JavaScript heap out of memory" in the JS bundle step
        EXTRA_PACKAGER_ARGS: "--max-workers=2"         # fewer Metro workers = less memory, avoids SIGTERM kills
    scripts:
      - name: Install JS dependencies
        script: yarn install
      - name: Create env files the Xcode project expects
        script: |
          cp .env.example .env
          mkdir -p ios/Config
          touch ios/Config/Env.xcconfig
      - name: Create placeholder GoogleService-Info.plist (Firebase config is not in the repo)
        script: |
          cat > ios/GoogleService-Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY000</string>
            <key>GCM_SENDER_ID</key>
            <string>123456789012</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>$BUNDLE_ID</string>
            <key>PROJECT_ID</key>
            <string>pocketpal-placeholder</string>
            <key>STORAGE_BUCKET</key>
            <string>pocketpal-placeholder.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <false/>
            <key>IS_SIGNIN_ENABLED</key>
            <false/>
            <key>GOOGLE_APP_ID</key>
            <string>1:123456789012:ios:0123456789abcdef01234567</string>
          </dict>
          </plist>
          EOF
      - name: Download Metal toolchain (needed for llama.rn Metal kernels)
        script: xcodebuild -downloadComponent MetalToolchain
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_DEVELOPMENT --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
