workflows:
  pocketpal-ios:
    name: PocketPal iOS (development IPA)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: pocketpalai      # name of the key in Codemagic Team integrations
    environment:
      node: 22.21.0                             # pinned in the repo's .nvmrc
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: PocketPal.xcworkspace  # verify in the ios/ folder
        XCODE_SCHEME: PocketPal                 # verify in Xcode scheme list
      ios_signing:
        distribution_type: development
        bundle_identifier: com.berkaysayran.pocketpalai   # must match PRODUCT_BUNDLE_IDENTIFIER
    scripts:
      - name: Install JS dependencies
        script: yarn install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Apply signing profiles to Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
